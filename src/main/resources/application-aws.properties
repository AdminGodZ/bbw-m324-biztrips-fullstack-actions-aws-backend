# ECS Fargate on AWS: Amazon RDS for MariaDB + Amazon S3.
# Deliberately NO defaults: a missing variable stops the container at start-up with
# "Could not resolve placeholder 'DB_HOST'" instead of silently connecting somewhere else.
#   DB_HOST, DB_PORT, DB_NAME          task definition environment (CloudFormation outputs)
#   DB_USER, DB_PASSWORD               ECS secrets -> AWS Secrets Manager (bbw-m324-refcard05/rds-biztrips)
#   APP_STORAGE_S3_BUCKET, AWS_REGION  task definition environment
# TLS to RDS is enforced and the server certificate is verified against the AWS RDS CA bundle.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=verify-full&serverSslCert=/app/rds-ca-bundle.crt
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

app.storage.type=s3
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET}
app.storage.s3.region=${AWS_REGION}
logging.level.ch.bbw.trips.storage=INFO
