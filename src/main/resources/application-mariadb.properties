# Docker Compose / local MariaDB. Connection parts come from environment variables.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_biztrips}
spring.datasource.username=${DB_USER:biztrips}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
