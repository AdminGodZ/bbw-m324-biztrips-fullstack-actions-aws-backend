# =====================================================================================
# Business Trips backend - common configuration (RefCard05, Tim Held)
#
# Profiles (SPRING_PROFILES_ACTIVE):
#   (none)   local development and tests: in-memory H2, photos in ./uploads
#   mariadb  Docker Compose: MariaDB container, storage type from APP_STORAGE_TYPE
#   aws      ECS Fargate: Amazon RDS MariaDB (TLS) + Amazon S3, see application-aws.properties
#
# No credentials are stored here. Everything environment-specific comes from environment
# variables (Compose: .env, ECS: task definition environment + Secrets Manager).
# =====================================================================================
spring.application.name=biztrips-backend

spring.datasource.url=jdbc:h2:mem:biztrips;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update

# --- Photo storage (RefCard04 local -> RefCard05 S3) ---
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.location=${APP_STORAGE_LOCATION:./uploads}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.prefix=${APP_STORAGE_S3_PREFIX:employee-photos/}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Actuator: health for ECS/ALB, info for version traceability ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,s3
management.endpoint.health.validate-group-membership=false
management.info.env.enabled=true
info.app.name=biztrips-backend
info.app.version=${APP_VERSION:dev}
info.app.commit=${GIT_SHA:local}
info.app.refcard=RefCard05
info.storage.type=${app.storage.type}
